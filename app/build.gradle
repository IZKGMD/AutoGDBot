plugins { id 'com.android.application' }

android {
    namespace 'com.izkgmd.vitatextbridge'
    compileSdk 35

    defaultConfig {
        applicationId 'com.izkgmd.vitatextbridge'
        minSdk 26
        targetSdk 34
        versionCode 5
        versionName '2.1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.github.mwiede:jsch:0.2.24'
}
