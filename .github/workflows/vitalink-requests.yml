name: VitaLink - dispatch a Vita job
on:
  push:
    branches: [vitabridge-android]
    paths:
      - 'vitalink/requests/request.json'
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate with GitHub OIDC and send VitaLink request
        run: python3 vitalink/request.py
