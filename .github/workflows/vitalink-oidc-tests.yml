name: VitaLink OIDC security tests
on:
  push:
    branches: [vitabridge-android]
    paths:
      - 'vitalink/server.py'
      - 'vitalink/request.py'
      - 'vitalink/test_oidc.py'
      - 'vitalink/install_oidc.sh'
      - '.github/workflows/vitalink-oidc-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    strategy:
      fail-fast: false
      matrix:
        pyjwt: ['2.3.0', '2.10.1']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install JWT verification dependencies
        run: python -m pip install --disable-pip-version-check 'PyJWT[crypto]==${{ matrix.pyjwt }}'
      - name: Python syntax check
        run: python -m py_compile vitalink/server.py vitalink/request.py vitalink/test_oidc.py
      - name: Bash syntax check
        run: bash -n vitalink/install_oidc.sh
      - name: Verify signed OIDC identity and reject forged claims
        run: python -m unittest discover -s vitalink -p test_oidc.py -v
