name: Validate AutoGDBot Realtime

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - realtime/**
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  source-integrity-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify materialized solver core
        run: python canonical/verify_core.py .

      - name: Restore immutable upstream snapshot
        run: python canonical/restore.py --output restored

      - name: Verify upstream snapshot
        run: python canonical/verify_core.py restored/AutoGDBot-Realtime

      - name: Compare materialized core with upstream snapshot
        shell: bash
        run: |
          set -euo pipefail
          P=restored/AutoGDBot-Realtime
          for f in src/main.cpp src/controller.hpp src/gpu_ranker.cpp src/hazard_guard.hpp src/input_motion.hpp src/planning_hints.hpp src/player_scalars.inc; do
            cmp "$f" "$P/$f"
          done

      - name: Configure standalone controller tests from repo root
        run: cmake -S . -B build-tests -DAUTOGDBOT_BUILD_MOD=OFF -DAUTOGDBOT_BUILD_TESTS=ON

      - name: Build standalone controller tests
        run: cmake --build build-tests --config Release --parallel

      - name: Run standalone controller tests
        run: ctest --test-dir build-tests -C Release --output-on-failure

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify solver core
        run: python canonical/verify_core.py .

      - name: Build Windows x64 from repo root
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given
          target: Win64
          build-config: Release
          bindings-ref: f050fd74ad531b0827377c97510cb807903ff1b3

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoGDBot-Realtime-Windows
          path: ${{ steps.build.outputs.build-output }}

  build-android64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify solver core
        run: python canonical/verify_core.py .

      - name: Build Android arm64-v8a from repo root
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given
          target: Android64
          build-config: Release
          bindings-ref: f050fd74ad531b0827377c97510cb807903ff1b3

      - name: Upload Android64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoGDBot-Realtime-Android64
          path: ${{ steps.build.outputs.build-output }}
