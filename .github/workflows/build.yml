name: Build AutoGDBot Realtime

on:
  workflow_dispatch:
  push:
    branches: [main, "dev/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply staircase/reset v0.3.2 patch
        run: python tools/apply_stability_v032.py .
      - name: Configure controller tests
        run: cmake -S . -B build-tests -DAUTOGDBOT_BUILD_MOD=OFF -DAUTOGDBOT_BUILD_TESTS=ON
      - name: Build controller tests
        run: cmake --build build-tests --config Release --parallel
      - name: Run controller tests
        run: ctest --test-dir build-tests -C Release --output-on-failure

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply staircase/reset v0.3.2 patch
        run: python tools/apply_stability_v032.py .
      - name: Build Windows x64 Geode mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given
          target: Win64
          build-config: Release
          bindings-ref: f050fd74ad531b0827377c97510cb807903ff1b3
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoGDBot-Realtime-Windows
          path: ${{ steps.build.outputs.build-output }}

  build-android64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply staircase/reset v0.3.2 patch
        run: python tools/apply_stability_v032.py .
      - name: Build Android64 Geode mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given
          target: Android64
          build-config: Release
          bindings-ref: f050fd74ad531b0827377c97510cb807903ff1b3
      - name: Upload Android64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoGDBot-Realtime-Android64
          path: ${{ steps.build.outputs.build-output }}

  materialize-route-source:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/dev/')
    needs: [tests, build-windows, build-android64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize validated v0.3.2 source
        shell: bash
        run: |
          python tools/apply_stability_v032.py .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/controller.hpp src/planning_hints.hpp src/main.cpp tests/controller_tests.cpp mod.json
          if git diff --cached --quiet; then
            echo "v0.3.2 source already materialized"
            exit 0
          fi
          git commit -m "source: materialize stability v0.3.2"
          git push origin HEAD:${GITHUB_REF_NAME}
