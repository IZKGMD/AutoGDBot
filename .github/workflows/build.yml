name: Validate AutoGDBot Realtime

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - realtime/**
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  materialize-source:
    if: github.event_name == 'push' && github.ref == 'refs/heads/realtime/direct-source'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore exact uploaded source
        run: python canonical/restore.py --output restored

      - name: Apply isolated Android64 platform layer
        run: python ports/apply_android.py restored/AutoGDBot-Realtime

      - name: Verify solver core stayed exact
        run: python canonical/verify_core.py restored/AutoGDBot-Realtime

      - name: Materialize source tree
        shell: bash
        run: |
          set -euo pipefail
          P=restored/AutoGDBot-Realtime
          for f in .clang-format .gitignore BUILD_INFO.json CMakeLists.txt LICENSE README.md SOURCES.md VALIDATION.md VIDEO_ANALYSIS.md mod.json; do
            cp "$P/$f" "$f"
          done
          rm -rf src original tests tools
          cp -R "$P/src" ./src
          cp -R "$P/original" ./original
          cp -R "$P/tests" ./tests
          cp -R "$P/tools" ./tools
          rm -f changelog.md

          cat > PORTING.md <<'EOF'
          # Windows / Android port

          `src/main.cpp`, `controller.hpp`, hazard guard, planning hints, input motion and player scalar state are the canonical AutoGDBot Realtime v0.2.1 solver core.

          Windows keeps the original D3D11 asynchronous candidate ranker in `src/gpu_ranker.cpp`.

          Android64 uses `src/gpu_ranker_stub.cpp`, which disables only D3D11 candidate ordering. The native Geometry Dash rollout, landing verification, hazard guard, warm-plan logic and CPU safety checks are shared unchanged.

          The exact user-supplied source ZIP is retained under `canonical/` and verified by SHA-256 in CI.
          EOF

      - name: Restore permanent validation workflow
        shell: bash
        run: |
          git fetch origin main:refs/remotes/origin/main
          git checkout origin/main -- .github/workflows/build.yml

      - name: Commit materialized source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit"
          else
            git commit -m "source: materialize canonical Realtime v0.2.1"
            git push origin HEAD:realtime/direct-source
          fi

  canonical-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore exact uploaded source
        run: python canonical/restore.py --output restored

      - name: Verify solver core hashes
        run: python canonical/verify_core.py restored/AutoGDBot-Realtime

      - name: Configure standalone controller tests
        run: cmake -S restored/AutoGDBot-Realtime -B restored/AutoGDBot-Realtime/build-tests -DAUTOGDBOT_BUILD_MOD=OFF -DAUTOGDBOT_BUILD_TESTS=ON

      - name: Build standalone controller tests
        run: cmake --build restored/AutoGDBot-Realtime/build-tests --config Release --parallel

      - name: Run standalone controller tests
        run: ctest --test-dir restored/AutoGDBot-Realtime/build-tests -C Release --output-on-failure

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore exact uploaded source
        run: python canonical/restore.py --output restored

      - name: Verify canonical ZIP and solver core
        run: python canonical/verify_core.py restored/AutoGDBot-Realtime

      - name: Build exact Windows x64 source
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          path: restored/AutoGDBot-Realtime
          sdk: given
          target: Win64
          build-config: Release
          bindings-ref: f050fd74ad531b0827377c97510cb807903ff1b3

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoGDBot-Realtime-Windows
          path: ${{ steps.build.outputs.build-output }}

  build-android64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore exact uploaded source
        run: python canonical/restore.py --output restored

      - name: Apply isolated Android64 platform layer
        run: python ports/apply_android.py restored/AutoGDBot-Realtime

      - name: Prove solver core stayed byte-for-byte unchanged
        run: python canonical/verify_core.py restored/AutoGDBot-Realtime

      - name: Build Android arm64-v8a Geode mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          path: restored/AutoGDBot-Realtime
          sdk: given
          target: Android64
          build-config: Release
          bindings-ref: f050fd74ad531b0827377c97510cb807903ff1b3

      - name: Upload Android64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoGDBot-Realtime-Android64
          path: ${{ steps.build.outputs.build-output }}
