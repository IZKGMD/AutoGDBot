name: Build AutoGDBot Realtime

on:
  workflow_dispatch:
  push:
    branches: [main, "dev/**", "fix/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply pending v0.3.1 stability patches
        shell: bash
        run: |
          for p in tools/v031_core.patch tools/v031_main.patch; do
            if [ -f "$p" ]; then
              git apply --check "$p"
              git apply "$p"
            fi
          done
      - name: Configure controller tests
        run: cmake -S . -B build-tests -DAUTOGDBOT_BUILD_MOD=OFF -DAUTOGDBOT_BUILD_TESTS=ON
      - name: Build controller tests
        run: cmake --build build-tests --config Release --parallel
      - name: Run controller tests
        run: ctest --test-dir build-tests -C Release --output-on-failure

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply pending v0.3.1 stability patches
        shell: bash
        run: |
          for p in tools/v031_core.patch tools/v031_main.patch; do
            if [ -f "$p" ]; then
              git apply --check "$p"
              git apply "$p"
            fi
          done
      - name: Build Windows x64 Geode mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given
          target: Win64
          build-config: Release
          bindings-ref: f050fd74ad531b0827377c97510cb807903ff1b3
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoGDBot-Realtime-v0.3.1-Windows
          path: ${{ steps.build.outputs.build-output }}

  build-android64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply pending v0.3.1 stability patches
        shell: bash
        run: |
          for p in tools/v031_core.patch tools/v031_main.patch; do
            if [ -f "$p" ]; then
              git apply --check "$p"
              git apply "$p"
            fi
          done
      - name: Build Android64 Geode mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given
          target: Android64
          build-config: Release
          bindings-ref: f050fd74ad531b0827377c97510cb807903ff1b3
      - name: Upload Android64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoGDBot-Realtime-v0.3.1-Android64
          path: ${{ steps.build.outputs.build-output }}

  materialize-stable-source:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/fix/')
    needs: [tests, build-windows, build-android64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize validated stable source
        shell: bash
        run: |
          for p in tools/v031_core.patch tools/v031_main.patch; do
            if [ -f "$p" ]; then
              git apply --check "$p"
              git apply "$p"
            fi
          done
          rm -f tools/v031_core.patch tools/v031_main.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Stable source already materialized"
            exit 0
          fi
          git commit -m "source: materialize stable double-spike v0.3.1"
          git push origin HEAD:${GITHUB_REF_NAME}
