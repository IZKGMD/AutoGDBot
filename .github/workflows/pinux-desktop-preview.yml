name: Pinux Astra desktop visual preview

on:
  push:
    branches: [ctrl-life]
    paths:
      - '.github/workflows/pinux-desktop-preview.yml'
      - 'core/src/main/java/life/ctrl/ui/PinuxWallpaper.java'
      - 'core/src/main/java/life/ctrl/ui/PinuxAstra.java'
      - 'core/src/main/java/life/ctrl/ui/PinuxDesktopStage.java'
      - 'core/src/main/java/life/ctrl/ui/PinuxWindowManager.java'
      - 'core/src/main/java/life/ctrl/ui/Workbench.java'
      - 'core/src/main/java/life/ctrl/render/PixelCanvas.java'
      - 'core/src/main/java/life/ctrl/ui/LifeScreens.java'
      - 'core/src/main/java/life/ctrl/CtrlLife.java'
      - 'lwjgl3/src/smoke/java/life/ctrl/desktop/PinuxSmoke.java'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Render actual Pinux Astra UI and run smoke
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          xvfb-run -a -s "-screen 0 1440x810x24" bash ./gradlew --no-daemon :lwjgl3:guiSmoke -Ppinux=true -PnoAudio=true
      - name: Save real game screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pinux-desktop-visual-preview
          path: lwjgl3/build/smoke/screenshots/pinux-*.png
          retention-days: 30
          if-no-files-found: error
