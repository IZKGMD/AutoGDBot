name: Diagnose portable Windows launcher
on:
  push:
    branches: [ctrl-life]
    paths: ['.github/workflows/windows-install-diagnostic.yml']
  workflow_dispatch:
    inputs:
      run_id:
        description: Release build artifact run
        required: true
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: CTRL-LIFE-0.9.0-First-Chapter-Windows-x64
          path: release
          run-id: ${{ inputs.run_id || '41990067741' }}
          github-token: ${{ github.token }}
      - name: Compare launcher paths and runtime contents
        shell: pwsh
        run: |
          Expand-Archive release/*.zip -DestinationPath ascii
          $root = (Get-ChildItem ascii -Directory | Select-Object -First 1).FullName
          Get-ChildItem "$root/runtime/bin" -File | Select-Object Name,Length | Format-Table
          Write-Output 'ASCII JAVA'
          & "$root/runtime/bin/java.exe" -version
          Write-Output "exit=$LASTEXITCODE"
          Move-Item ascii 'Проверка игры'
          $root = (Get-ChildItem 'Проверка игры' -Directory | Select-Object -First 1).FullName
          Write-Output 'UNICODE JAVA'
          & "$root/runtime/bin/java.exe" -version
          Write-Output "exit=$LASTEXITCODE"
          $env:PATH = "$root/runtime/bin;" + $env:PATH
          Write-Output 'UNICODE JAVA WITH BIN ON PATH'
          & "$root/runtime/bin/java.exe" -version
          Write-Output "exit=$LASTEXITCODE"
          Write-Output 'SHORT PATH JAVA'
          $shortJava = (& cmd.exe /d /c "for %I in (`"$root\runtime\bin\java.exe`") do @echo %~sI")
          Write-Output $shortJava
          & $shortJava -version
          Write-Output "exit=$LASTEXITCODE"
          Copy-Item "$root/runtime" runtime-ascii -Recurse
          Write-Output 'ASCII RUNTIME WITH UNICODE CLASSPATH'
          & "$PWD/runtime-ascii/bin/java.exe" '-Dfile.encoding=UTF-8' -cp "$root/lib/*" life.ctrl.desktop.DesktopLauncher --check-install
          Write-Output "exit=$LASTEXITCODE"
          Copy-Item launch.ps1 "$root/launch.ps1"
          Write-Output 'PRODUCTION LAUNCHER FROM UNICODE PATH'
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$root/launch.ps1" --check-install
          if ($LASTEXITCODE -ne 0) { throw 'Unicode launcher failed' }
          exit 0
