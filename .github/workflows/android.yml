name: Build VitaTextBridge APK
on:
  push:
    branches: ['vitabridge-android']
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: VitaTextBridge-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish direct-download APK on GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="vitacontrol-v2.3.0"
          cp app/build/outputs/apk/debug/app-debug.apk VitaControl-2.3.0.apk
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "VitaControl 2.3.0" --notes "Native Android controller. Live Sakura terminal for installs and game launches with logs, package manager and embedded game projects." --target "$GITHUB_SHA"
          gh release upload "$TAG" VitaControl-2.3.0.apk --clobber
